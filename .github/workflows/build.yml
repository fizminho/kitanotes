name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Validate D1 migration with SQLite
        run: python3 scripts/validate_migration.py
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run
