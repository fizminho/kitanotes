name = "kitanotes"
main = "worker/index.ts"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_ENV = "production"

# D1 is intentionally not bound until a KitaNotes-specific database is created.
# Never reuse the magic-screen / Investlah database_id.
