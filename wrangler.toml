name = "kitanotes"
main = "worker/index.ts"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
APP_ENV = "development"

# D1 is intentionally not bound until a KitaNotes-specific database is created.
# Never reuse the magic-screen / Investlah database_id.

[[d1_databases]]
binding = "DB"
database_name = "kitanotes-db"
database_id = "cb4cb9e3-eab9-47d6-9e56-49c6b52b2062" # Replace after creating the dedicated KitaNotes D1 database.
migrations_dir = "./migrations"

[triggers]
crons = ["*/5 * * * *"]
