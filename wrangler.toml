name = "kitanotes"
main = "worker/index.ts"
compatibility_date = "2026-11-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
APP_ENV = "production"
GOOGLE_CLIENT_ID = "762562595362-p71q7ujjuuni41s6ouo9g0gim6rfnv6o.apps.googleusercontent.com"
APP_BASE_URL = "https://kitanotes.binalah.com"

[[d1_databases]]
binding = "DB"
database_name = "kitanotes-db"
database_id = "cb4cb9e3-eab9-47d6-9e56-49c6b52b2062"
migrations_dir = "./migrations"

[triggers]
crons = ["*/5 * * * *"]
